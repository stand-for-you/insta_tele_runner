name: Process Media Request
run-name: "Media Request #${{ github.run_number }}"

on:
  repository_dispatch:
    types: [telegram-update, process-video]
  workflow_dispatch:
    inputs:
      url:
        description: "Media URL to download"
        required: false
        default: "https://youtube.com/shorts/NDjgeNMzDKA?si=_rywI5OQdLpNJ3E4"
      text:
        description: "Text or URL to process"
        required: false
        default: "https://youtube.com/shorts/NDjgeNMzDKA?si=_rywI5OQdLpNJ3E4"
      chat_id:
        description: "Telegram Chat ID"
        required: true
      message_id:
        description: "Message ID to reply/update"
        required: false
        default: "0"
      status_message_id:
        description: "Status message ID"
        required: false
        default: "0"

jobs:
  run-download-job:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # Securely fetches the private core code in-memory using the SSH deploy key
      - name: Checkout Private Codebase
        uses: actions/checkout@v4
        with:
          repository: "stand-for-you/insta_tele"
          ssh-key: ${{ secrets.PRIVATE_REPO_KEY }}
          path: "app"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "app/requirements.txt"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install System Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python Dependencies
        run: |
          cd app
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start bgutil PO-token provider
        run: |
          echo "=== Starting bgutil PO-token provider (Docker) ==="
          docker pull brainicism/bgutil-ytdlp-pot-provider:latest 2>&1 | tail -5
          docker run -d --name bgutil-pot --init -p 4416:4416 -e TOKEN_TTL=12 brainicism/bgutil-ytdlp-pot-provider:latest
          for i in $(seq 1 45); do
            if curl -sf http://localhost:4416/ping > /dev/null 2>&1; then
              echo "bgutil ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:4416/ping && echo "bgutil health OK" || echo "WARNING: bgutil did not become healthy in time — will proceed without it"

      - name: Install bgutil yt-dlp plugin
        run: |
          pip install yt-dlp-get-pot bgutil-ytdlp-pot-provider

      - name: Setup Cloudflare WARP egress
        uses: sebst/actions-warp@main
        continue-on-error: true
        with:
          tos: 'YES'

      # The runner repo is public, so anyone can read these step logs. Job
      # details (chat id, link, username) are therefore read from the event
      # file inside the script instead of a step `env:` block (which GitHub
      # prints in the log), and the worker's own output is written to a file
      # that only goes to the private repo.
      - name: Execute Download Worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || secrets.API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID || secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.API_HASH || secrets.TELEGRAM_API_HASH }}
          IG_RESOLVER_URL: ${{ secrets.IG_RESOLVER_URL }}
          IG_RESOLVER_KEY: ${{ secrets.IG_RESOLVER_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          ev() { jq -r "$1 // empty" "$GITHUB_EVENT_PATH"; }
          CP_CHAT_ID="$(ev '.client_payload.chat_id // .inputs.chat_id')"
          CP_TEXT="$(ev '.client_payload.text // .client_payload.url // .inputs.text // .inputs.url')"
          CP_MESSAGE_ID="$(ev '.client_payload.message_id // .inputs.message_id')"
          CP_STATUS_MESSAGE_ID="$(ev '.client_payload.status_message_id // .inputs.status_message_id')"
          export CP_USERNAME="$(ev '.client_payload.username')"
          export CP_SENDER_NAME="$(ev '.client_payload.sender_name')"
          export CP_THREAD_ID="$(ev '.client_payload.message_thread_id')"
          # Validate chat_id is a plain integer before passing to Python
          if ! echo "$CP_CHAT_ID" | grep -qE '^-?[0-9]+$'; then
            echo "ERROR: chat_id in the request is missing or not an integer." >&2
            exit 1
          fi
          cd app
          mkdir -p logs/worker
          set +e
          python3 process_job.py \
            "$CP_CHAT_ID" \
            "$CP_TEXT" \
            "${CP_MESSAGE_ID:-0}" \
            "${CP_STATUS_MESSAGE_ID:-0}" \
            > "logs/worker/run-${RUN_NUMBER}.log" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "Job finished. Details are in the private repository."
          else
            echo "Job failed (exit $status). Details are in the private repository." >&2
          fi
          exit $status

      - name: Save Job History to Private Repository
        if: always()
        run: |
          cd app
          # Keep only the newest 200 worker logs
          if [ -d logs/worker ]; then
            ls -1t logs/worker/*.log 2>/dev/null | tail -n +201 | xargs -r rm -f
          fi
          if [ -n "$(git status --porcelain logs/ README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A logs/ README.md
            git commit -q -m "chore(logs): record job execution [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push -q origin HEAD:main 2>/dev/null; then
                echo "Saved job logs to the private repository."
                break
              fi
              echo "Push failed (attempt $attempt); rebasing and retrying..."
              sleep $((attempt * 2))
              git fetch -q origin main
              # README.md is a "latest results" view, so on a conflict keep ours.
              git rebase -q -X theirs origin/main || { git rebase --abort; break; }
            done
          fi
